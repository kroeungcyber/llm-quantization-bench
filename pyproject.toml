[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-quantization-bench"
version = "0.1.0"
description = "Benchmark measurement repo for LLM quantization comparisons using llama.cpp"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "mypy",
    "flake8",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["eval*", "bench*"]

[tool.mypy]
overrides = [
    { module = "matplotlib.*", ignore_missing_imports = true },
]
